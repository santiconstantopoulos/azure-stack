server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta del front devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El front llama a /api/... y nginx lo reenvía al contenedor "api".
    # "api" se resuelve por DNS interno de la red de compose.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
